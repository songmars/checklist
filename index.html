<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 체크리스트</title>
    
    <!-- PWA 앱 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        * { box-sizing: border-box; }
        
        /* 전체 배경 흰색 통일 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        /* 400px 고정 규격 위젯 레이아웃 (모든 배경 흰색 통일) */
        .widget-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px; /* 가로 길이 400px 고정 */
            height: 100vh;
            margin: 0 auto;
            padding: 16px;
            background-color: #ffffff;
        }

        /* 상단 헤더 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        h2 { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 700;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 초록색 앱 설치 버튼 및 두근거림 애니메이션 */
        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 8px 3px rgba(46, 125, 50, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }

        .top-btn-group { display: flex; gap: 6px; }
        .header-btn {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: #666666;
            transition: all 0.2s;
        }
        .header-btn:hover { background: #f5f5f5; }
        .header-btn.install {
            background-color: #2e7d32; /* 초록색 변경 */
            color: #ffffff;
            border: none;
            display: none;
            animation: pulse-glow 1.5s infinite;
        }

        /* 🗂️ 탭 조작 영역 */
        .tab-control-area {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        select {
            flex: 1;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            background-color: #ffffff;
            outline: none;
            cursor: pointer;
            font-weight: 500;
            min-width: 0;
        }
        .tab-input {
            flex: 1;
            padding: 8px 10px;
            font-size: 13px;
            border: 2px solid #000000;
            border-radius: 6px;
            outline: none;
            background-color: #ffffff;
            min-width: 0;
        }
        .small-btn {
            padding: 7px 10px;
            font-size: 12px;
            border: 1px solid #dcdfe6;
            background-color: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            color: #555555;
            white-space: nowrap;
        }
        .small-btn:hover { background-color: #f5f5f5; }
        .small-btn.del { color: #e53935; }
        .small-btn.confirm { background-color: #2e7d32; color: #ffffff; border: none; }
        .small-btn.cancel { background-color: #757575; color: #ffffff; border: none; }

        /* 📊 초슬림 달성도 바 */
        .progress-card {
            background-color: #ffffff;
            padding: 2px 2px;
            margin-bottom: 10px;
        }
        .progress-title {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #888888;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .progress-bar-bg {
            width: 100%;
            height: 3px;
            background-color: #eeeeee;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #000000;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* 입력 영역 */
        .input-area {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        input[type="text"].main-input {
            padding: 10px 12px;
            flex: 1;
            font-size: 13px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            background: #ffffff;
            min-width: 0;
        }
        input[type="text"].main-input:focus { border-color: #000000; }
        
        /* 추가 버튼 검은색 변경 */
        .add-btn {
            padding: 10px 14px;
            cursor: pointer;
            background-color: #000000; /* 검은색 변경 */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .add-btn:hover { background-color: #333333; }

        /* 📜 스크롤 목록 영역 */
        .list-container {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 8px 12px;
        }

        ul { list-style-type: none; padding: 0; margin: 0; }
        li {
            padding: 10px 0;
            display: flex;
            align-items: center; 
            gap: 10px; 
            border-bottom: 1px solid #f0f0f0;
            width: 100%;
        }
        li:last-child { border-bottom: none; }
        
        label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #000000;
            cursor: pointer;
        }
        .task-text { font-size: 13px; color: #2c3e50; word-break: break-all; }
        .completed { color: #b0b8c4; text-decoration: line-through; }
        .task-del-btn {
            color: #cccccc;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
        }
        .task-del-btn:hover { color: #e53935; }

        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: #dcdfe6; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="widget-container">
        <!-- 1. 헤더 -->
        <div class="header-area">
            <h2>📝 체크리스트</h2>
            <div class="top-btn-group">
                <button class="header-btn install" id="pwaInstallBtn" onclick="installPWA()">📲 앱 설치</button>
                <button class="header-btn" id="resetAppBtn" onclick="resetApp()">초기화</button>
            </div>
        </div>

        <!-- 2. 탭 조작 -->
        <div class="tab-control-area" id="tabMainControls">
            <select id="tabSelect" onchange="switchTab(this.value)"></select>
            <button class="small-btn" onclick="openTabEdit('add')">+ 추가</button>
            <button class="small-btn" onclick="openTabEdit('rename')">수정</button>
            <button class="small-btn del" id="delTabBtn" onclick="deleteTab()">삭제</button>
        </div>

        <div class="tab-control-area" id="tabEditControls" style="display: none;">
            <input type="text" class="tab-input" id="tabNameInput" placeholder="탭 이름 입력">
            <button class="small-btn confirm" onclick="saveTabName()">확인</button>
            <button class="small-btn cancel" onclick="cancelTabEdit()">취소</button>
        </div>

        <!-- 3. 초슬림 달성도 바 -->
        <div class="progress-card">
            <div class="progress-title">
                <span>달성도</span>
                <span id="progressText">0 / 0 완료 (0%)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- 4. 입력창 -->
        <div class="input-area">
            <input type="text" id="taskInput" class="main-input" placeholder="새 할 일 적기...">
            <button class="add-btn" onclick="addTask()">추가</button>
        </div>

        <!-- 5. 스크롤 목록 -->
        <div class="list-container">
            <ul id="taskList"></ul>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaInstallBtn').style.display = 'inline-block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwaInstallBtn').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        let appData = JSON.parse(localStorage.getItem('myChecklist')) || [
          { id: 1, title: '기본 탭', tasks: [] }
        ];
        let currentTabId = appData[0] ? appData[0].id : null;
        let tabEditMode = ''; 
        let deleteConfirm = false; 
        let resetConfirm = false;

        function resetApp() {
            const resetBtn = document.getElementById("resetAppBtn");
            if (!resetConfirm) {
                resetConfirm = true;
                resetBtn.textContent = "진짜 초기화?";
                resetBtn.style.backgroundColor = "#e53935";
                resetBtn.style.color = "#ffffff";
                resetBtn.style.borderColor = "#e53935";
                
                setTimeout(() => {
                    resetConfirm = false;
                    resetBtn.textContent = "초기화";
                    resetBtn.style.backgroundColor = "#ffffff";
                    resetBtn.style.color = "#666666";
                    resetBtn.style.borderColor = "#e0e0e0";
                }, 3000);
            } else {
                localStorage.removeItem('myChecklist');
                appData = [{ id: 1, title: '기본 탭', tasks: [] }];
                currentTabId = appData[0].id;
                
                resetConfirm = false;
                resetBtn.textContent = "초기화";
                resetBtn.style.backgroundColor = "#ffffff";
                resetBtn.style.color = "#666666";
                resetBtn.style.borderColor = "#e0e0e0";
                
                saveAndRender();
            }
        }

        function renderTabs() {
            const select = document.getElementById("tabSelect");
            select.innerHTML = "";
            
            appData.forEach(tab => {
                const option = document.createElement("option");
                option.value = tab.id;
                option.textContent = tab.title;
                if (tab.id === currentTabId) option.selected = true;
                select.appendChild(option);
            });

            const delBtn = document.getElementById("delTabBtn");
            delBtn.style.display = appData.length > 1 ? "inline-block" : "none";
            delBtn.textContent = "삭제";
            delBtn.style.backgroundColor = "";
            delBtn.style.color = "";
            deleteConfirm = false; 
        }

        function switchTab(tabId) {
            currentTabId = Number(tabId);
            renderTasks();
            cancelTabEdit(); 
        }

        function openTabEdit(mode) {
            tabEditMode = mode;
            document.getElementById("tabMainControls").style.display = "none";
            document.getElementById("tabEditControls").style.display = "flex";
            
            const input = document.getElementById("tabNameInput");
            if (mode === 'add') {
                input.value = "";
                input.placeholder = "새 탭 이름 입력";
            } else if (mode === 'rename') {
                const currentTab = appData.find(t => t.id === currentTabId);
                input.value = currentTab ? currentTab.title : "";
            }
            input.focus();
        }

        function cancelTabEdit() {
            document.getElementById("tabMainControls").style.display = "flex";
            document.getElementById("tabEditControls").style.display = "none";
        }

        function saveTabName() {
            const newTitle = document.getElementById("tabNameInput").value.trim();
            if (newTitle === "") {
                cancelTabEdit();
                return;
            }

            if (tabEditMode === 'add') {
                const newId = Date.now();
                appData.push({ id: newId, title: newTitle, tasks: [] });
                currentTabId = newId;
            } else if (tabEditMode === 'rename') {
                const currentTab = appData.find(t => t.id === currentTabId);
                if (currentTab) currentTab.title = newTitle;
            }
            
            cancelTabEdit();
            saveAndRender();
        }

        function deleteTab() {
            if (appData.length <= 1) return;
            
            const delBtn = document.getElementById("delTabBtn");
            if (!deleteConfirm) {
                deleteConfirm = true;
                delBtn.textContent = "진짜 삭제?";
                delBtn.style.backgroundColor = "#e53935";
                delBtn.style.color = "#ffffff";
                
                setTimeout(() => { renderTabs(); }, 3000);
            } else {
                appData = appData.filter(t => t.id !== currentTabId);
                currentTabId = appData[0].id;
                saveAndRender();
            }
        }

        function renderTasks() {
            const list = document.getElementById("taskList");
            list.innerHTML = ""; 
            
            const currentTab = appData.find(t => t.id === currentTabId);
            if (!currentTab) return;

            let completedCount = 0;
            const totalCount = currentTab.tasks.length;

            currentTab.tasks.forEach(task => {
                if (task.done) completedCount++;
                const li = document.createElement("li");
                li.innerHTML = `
                    <label>
                        <input type="checkbox" onchange="toggleTask(${task.id})" ${task.done ? 'checked' : ''}>
                        <span class="task-text ${task.done ? 'completed' : ''}">${task.text}</span>
                    </label>
                    <button class="task-del-btn" onclick="deleteTask(${task.id})">✖</button>
                `;
                list.appendChild(li);
            });

            const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);
            document.getElementById("progressBar").style.width = percent + "%";
            document.getElementById("progressText").textContent = `${completedCount} / ${totalCount} 완료 (${percent}%)`;
        }

        function toggleTask(taskId) {
            const currentTab = appData.find(t => t.id === currentTabId);
            if (!currentTab) return;
            const task = currentTab.tasks.find(t => t.id === taskId);
            if (task) {
                task.done = !task.done;
                saveAndRender();
            }
        }

        function deleteTask(taskId) {
            const currentTab = appData.find(t => t.id === currentTabId);
            if (!currentTab) return;
            currentTab.tasks = currentTab.tasks.filter(t => t.id !== taskId);
            saveAndRender();
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();
            if (taskText === "") return;
            
            const currentTab = appData.find(t => t.id === currentTabId);
            currentTab.tasks.push({ id: Date.now(), text: taskText, done: false });
            
            input.value = "";
            saveAndRender();
            
            const container = document.querySelector('.list-container');
            container.scrollTop = container.scrollHeight;
        }

        function saveAndRender() {
            localStorage.setItem('myChecklist', JSON.stringify(appData));
            renderTabs();
            renderTasks();
        }

        document.getElementById("taskInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") addTask();
        });
        document.getElementById("tabNameInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") saveTabName();
            if (event.key === "Escape") cancelTabEdit(); 
        });

        saveAndRender();
    </script>
</body>
</html>
